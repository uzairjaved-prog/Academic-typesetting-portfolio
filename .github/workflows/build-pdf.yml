name: Build PDFs

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint Python
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install ruff
      - run: ruff check scripts

  build:
    name: Build documents
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install TeX Live packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            latexmk texlive-latex-recommended texlive-latex-extra \
            texlive-science texlive-publishers texlive-pictures \
            texlive-fonts-recommended texlive-bibtex-extra

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Generate data and figures
        run: |
          python scripts/make_data.py
          python scripts/generate_figures.py

      - name: Build TikZ showcase
        run: latexmk -pdf -cd -interaction=nonstopmode -halt-on-error src/tikz/showcase.tex

      - name: Build journal paper (IEEEtran)
        run: latexmk -pdf -cd -interaction=nonstopmode -halt-on-error src/paper/main.tex

      - name: Build thesis
        run: latexmk -pdf -cd -interaction=nonstopmode -halt-on-error src/thesis/main.tex

      - name: Fail on undefined references or citations
        run: |
          for f in src/paper/main.log src/thesis/main.log src/tikz/showcase.log; do
            if grep -E "undefined (references|citations)|Citation .* undefined|Reference .* undefined" "$f"; then
              echo "Undefined references found in $f"; exit 1
            fi
          done

      - name: Collect PDFs into dist/
        run: |
          mkdir -p dist
          cp src/paper/main.pdf    dist/paper.pdf
          cp src/thesis/main.pdf   dist/thesis.pdf
          cp src/tikz/showcase.pdf dist/tikz_showcase.pdf
          (cd dist && sha256sum *.pdf > SHA256SUMS)

      - uses: actions/upload-artifact@v4
        with:
          name: pdfs
          path: dist/
          if-no-files-found: error

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pdfs
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
